name: Intenseye
description: >-
  Intenseye is an AI-powered workplace safety platform that applies computer vision to a
  facility's existing CCTV cameras to detect unsafe conditions and behaviors in real time and
  prevent Serious Injuries and Fatalities (SIF). Its Environment, Health and Safety (EHS)
  product surfaces hazards, compliance gaps, and operational risks across manufacturing,
  logistics, food & beverage, and other high-risk industries, and can trigger Hard Stop
  emergency alerts. Intenseye offers cloud, private cloud, and on-premise deployment, is
  SOC 2 / AICPA certified and GDPR-aligned, uses AES-256 encryption at rest and TLS in transit,
  and does not use facial recognition. Backed by Insight Partners, Lightspeed Venture Partners,
  and Point Nine. Intenseye publishes no public API, SDK, or developer portal; product access is
  through its dashboard and login. It maintains a public GitHub organization of mostly open-source
  forks and workshops rather than first-party client libraries.
